<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast — GTA-style cover maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Neon Coast</h1>
    <p class="tagline">Turn any photo and a caption into GTA-style cover art. Your photos never leave this machine.</p>

    <fieldset class="photos">
      <legend>Photos</legend>
      <div class="slot" data-slot="0">
        <span class="slot-name">Photo 1</span>
        <label class="file-btn">Choose file <input type="file" accept="image/*" data-photo="0"></label>
        <button type="button" class="sample" data-sample="boulevard" data-slot="0">Boulevard</button>
        <button type="button" class="sample" data-sample="neon" data-slot="0">Neon street</button>
        <button type="button" class="sample" data-sample="pier" data-slot="0">Pier</button>
        <button type="button" class="fill-all" data-slot="0">Fill all panels</button>
      </div>
      <div class="slot" data-slot="1">
        <span class="slot-name">Photo 2</span>
        <label class="file-btn">Choose file <input type="file" accept="image/*" data-photo="1"></label>
        <button type="button" class="sample" data-sample="boulevard" data-slot="1">Boulevard</button>
        <button type="button" class="sample" data-sample="neon" data-slot="1">Neon street</button>
        <button type="button" class="sample" data-sample="pier" data-slot="1">Pier</button>
        <button type="button" class="fill-all" data-slot="1">Fill all panels</button>
      </div>
      <div class="slot" data-slot="2">
        <span class="slot-name">Photo 3</span>
        <label class="file-btn">Choose file <input type="file" accept="image/*" data-photo="2"></label>
        <button type="button" class="sample" data-sample="boulevard" data-slot="2">Boulevard</button>
        <button type="button" class="sample" data-sample="neon" data-slot="2">Neon street</button>
        <button type="button" class="sample" data-sample="pier" data-slot="2">Pier</button>
        <button type="button" class="fill-all" data-slot="2">Fill all panels</button>
      </div>
      <div class="slot" data-slot="3">
        <span class="slot-name">Photo 4</span>
        <label class="file-btn">Choose file <input type="file" accept="image/*" data-photo="3"></label>
        <button type="button" class="sample" data-sample="boulevard" data-slot="3">Boulevard</button>
        <button type="button" class="sample" data-sample="neon" data-slot="3">Neon street</button>
        <button type="button" class="sample" data-sample="pier" data-slot="3">Pier</button>
        <button type="button" class="fill-all" data-slot="3">Fill all panels</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Layout</legend>
      <div class="choices" id="layout-choices">
        <label><input type="radio" name="layout" value="hero" checked> Hero + two</label>
        <label><input type="radio" name="layout" value="grid"> Four panels</label>
        <label><input type="radio" name="layout" value="triptych"> Three up</label>
        <label><input type="radio" name="layout" value="nine"> Nine panel</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Colour grade</legend>
      <div class="choices" id="grade-choices">
        <label><input type="radio" name="grade" value="sunset" checked> Sunset</label>
        <label><input type="radio" name="grade" value="neon"> Neon night</label>
        <label><input type="radio" name="grade" value="vice"> Vice pink</label>
        <label><input type="radio" name="grade" value="midnight"> Midnight</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Export size</legend>
      <div class="choices" id="size-choices">
        <label><input type="radio" name="size" value="square" checked> 1080 x 1080</label>
        <label><input type="radio" name="size" value="portrait"> 1080 x 1350</label>
        <label><input type="radio" name="size" value="wide"> 1920 x 1080</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Words</legend>
      <label class="wide">Caption
        <input id="caption" type="text" maxlength="30" value="NEON COAST">
      </label>
      <label class="wide">Subtitle
        <input id="subtitle" type="text" maxlength="30" value="sunset run">
      </label>
    </fieldset>

    <fieldset>
      <legend>Selected panel <span id="panel-name">1</span></legend>
      <p class="hint">Click a panel in the preview to select it.</p>
      <label class="wide">Photo in this panel
        <select id="panel-photo">
          <option value="0">Photo 1</option>
          <option value="1">Photo 2</option>
          <option value="2">Photo 3</option>
          <option value="3">Photo 4</option>
        </select>
      </label>
      <label class="wide">Zoom <span id="zoom-value">1.00x</span>
        <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1">
      </label>
      <label class="wide">Move left / right
        <input id="pan-x" type="range" min="-0.3" max="0.3" step="0.01" value="0">
      </label>
      <label class="wide">Move up / down
        <input id="pan-y" type="range" min="-0.3" max="0.3" step="0.01" value="0">
      </label>
    </fieldset>

    <button id="export" type="button">Export PNG</button>
    <p id="status" role="status"></p>
  </section>

  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
    <p class="preview-note">Live preview — what you see is the PNG you get.</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
